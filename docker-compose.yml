services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/prod.db
      UPLOADS_DIR: /data/uploads
      PORT: 3000
    volumes:
      - api-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  api-data:
  caddy-data:
  caddy-config:
